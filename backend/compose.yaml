services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: affordable
      POSTGRES_USER: affordable
      POSTGRES_PASSWORD: affordable
    ports:
      - "5432:5432"
    volumes:
      - affordable_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U affordable -d affordable"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  affordable_postgres_data:
